    <text class="serif enter" x="55" y="238" font-size="140" fill="#151515">Siddhi</text>
    <text class="serif enter later" x="53" y="363" font-size="140" font-style="italic" fill="#151515">Joshi</text>
    <text x="59" y="424" font-size="22" fill="#45454a">I turn ideas into useful, approachable software.</text>
    <text x="59" y="461" font-size="22" fill="#45454a">Building across the web, one project at a time.</text>
    <text class="mono" x="60" y="497" font-size="14" fill="#151515">portfolio</text>
