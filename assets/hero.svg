<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
<title id="title">Siddhi Joshi</title><desc id="desc">Software developer building, learning and sharing. Animated SJ text mark.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}text[font-family^="Georgia"]{font-family:Georgia,serif}text[font-family^="Consolas"]{font-family:Consolas,monospace}.print{animation:print .12s both}.rise{animation:rise .75s both}.late{animation-delay:.28s}.later{animation-delay:.55s}.ring{animation:pulse 4s ease-in-out infinite}@keyframes print{from{opacity:0}to{opacity:1}}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{50%{opacity:.55;transform:scale(1.06)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
